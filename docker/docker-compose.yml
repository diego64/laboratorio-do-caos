name: laboratorio-do-caos

services:

  api:
    build:
      context: ..
      dockerfile: Dockerfile
      target: release
    container_name: laboratorio-do-caos
    env_file: [../.env]
    environment:
      # a imagem release nao tem pino-pretty (devDependency); NODE_ENV=development
      # vindo do .env faria o logger tentar carregar o transport e matar o boot
      NODE_ENV: production
      # o .env guarda as URLs apontando para localhost, para o tooling do host
      # (pnpm db:seed etc). Dentro da rede do compose o host e' o nome do servico.
      POSTGRES_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MONGO_URL: mongodb://${MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD}@mongo:27017/${MONGO_INITDB_DATABASE}?authSource=${MONGO_INITDB_DATABASE}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
    ports:
      # a app escuta na 3000; 3001 e' so a porta publicada (3000 do host e' do grafana)
      - "3001:3000"
    depends_on:
      postgres: {condition: service_healthy}
      mongo:    {condition: service_healthy}
    restart: unless-stopped
    stop_grace_period: 20s
    deploy:
      resources:
        limits: { memory: 512M }
    networks: [chaos]

  postgres:
    image: postgres:18.4-alpine3.24
    container_name: chaos-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: ["postgres", "-c", "max_connections=100"]
    ports:
      - "5432:5432"
    volumes:
      - ../db/migrations:/docker-entrypoint-initdb.d:ro
      # postgres 18+ guarda os dados em subpasta de /var/lib/postgresql; montar em /data e' recusado
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks: [chaos]

  mongo:
    image: mongo:8
    container_name: chaos-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
      # consumidas por db/seeds/00-init-mongo.js para criar o usuario da aplicacao
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    # --replSet com auth exige security.keyFile; a app nao usa transacao nem change stream,
    # entao o replica set so custava um keyfile. Reative os dois juntos se precisar.
    command: ["mongod", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - ../db/seeds:/docker-entrypoint-initdb.d:ro
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks: [chaos]

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.18.1
    container_name: chaos-postgres-exporter
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [chaos]

  mongodb-exporter:
    image: percona/mongodb_exporter:0.47.1
    container_name: chaos-mongodb-exporter
    # --collect-all liga dbstats/collstats/indexstats; --compatible-mode expoe
    # tambem os nomes legados (mongodb_up, mongodb_connections) usados no dashboard
    command:
      - --mongodb.uri=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      - --collect-all
      - --compatible-mode
    depends_on:
      mongo: {condition: service_healthy}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [chaos]

  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: chaos-prometheus
    ports: ["9090:9090"]
    volumes:
      - ../infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../infra/observability/prometheus/rules:/etc/prometheus/rules:ro
      - promdata:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    restart: unless-stopped
    networks: [chaos]

  grafana:
    image: grafana/grafana:13.1.3
    container_name: chaos-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?defina GF_SECURITY_ADMIN_PASSWORD no .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ../infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../infra/observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [chaos]

  loki:
    image: grafana/loki:3.7.6
    container_name: chaos-loki
    command: ["-config.file=/etc/loki/config.yml"]
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ../infra/observability/loki/loki-config.yml:/etc/loki/config.yml:ro
      - lokidata:/loki
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [chaos]

  tempo:
    image: grafana/tempo:3.0.3
    container_name: chaos-tempo
    command: ["-config.file=/etc/tempo/config.yml"]
    ports:
      - "127.0.0.1:3200:3200"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - ../infra/observability/tempo/tempo-config.yml:/etc/tempo/config.yml:ro
      - tempodata:/var/tempo
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [chaos]

  alloy:
    image: grafana/alloy:v1.18.1
    container_name: chaos-alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    ports:
      - "127.0.0.1:12345:12345"
    volumes:
      - ../infra/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloydata:/var/lib/alloy/data
    depends_on:
      - loki
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks: [chaos]

volumes:
  pgdata:
  mongodata:
  promdata:
  grafanadata:
  lokidata:
  tempodata:
  alloydata:

networks:
  chaos:
    driver: bridge
