name: Bug report
description: Reportar um comportamento incorreto ou uma falha de infraestrutura
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Antes de abrir: procure por Issues abertas ou fechadas com o mesmo problema.

        Se o assunto for uma vulnerabilidade de segurança, **não abra uma Issue** —
        use o canal privado descrito em `.github/SECURITY.md`.

  - type: textarea
    id: descricao
    attributes:
      label: Descrição
      description: O que está errado, em uma ou duas frases.
    validations:
      required: true

  - type: textarea
    id: reproducao
    attributes:
      label: Passos para reprodução
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: esperado
    attributes:
      label: Comportamento esperado
    validations:
      required: true

  - type: textarea
    id: atual
    attributes:
      label: Comportamento atual
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >
        Saída relevante de `docker compose logs`, do teste que falhou ou do CI.
        Remova tokens, senhas e demais credenciais antes de colar.
      render: shell
    validations:
      required: false

  - type: dropdown
    id: camada
    attributes:
      label: Camada afetada
      options:
        - docker
        - infra
        - db
        - scripts
        - ci
        - docs
        - src
        - não sei
    validations:
      required: true

  - type: dropdown
    id: execucao
    attributes:
      label: Forma de execução
      options:
        - local (pnpm dev)
        - docker compose
        - render
        - CI
    validations:
      required: true

  - type: input
    id: versao
    attributes:
      label: Versão da aplicação
      description: Tag, commit ou o `version` do `package.json`.
    validations:
      required: true

  - type: input
    id: ambiente
    attributes:
      label: Node.js / pnpm / SO
      placeholder: "node v22.11.0 · pnpm 10.4.1 · Ubuntu 24.04 (WSL2)"
    validations:
      required: true

  - type: textarea
    id: contexto
    attributes:
      label: Contexto adicional
      description: >
        Opcional: entrada relacionada em `docs/CATALOGO-DE-FALHAS.md`, hipótese de
        causa raiz, workaround conhecido.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: Procurei por Issues abertas ou fechadas com o mesmo problema.
          required: true
        - label: Consegui reproduzir a falha mais de uma vez.
          required: true
        - label: Não há credenciais nem dados sensíveis neste relato.
          required: true
