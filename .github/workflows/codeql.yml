name: CodeQL

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: ["typescript"]
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          paths-ignore: |
            src/**
            tests/**

      - uses: github/codeql-action/analyze@v3
