apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaos-lab-api
  labels:
    app.kubernetes.io/name: chaos-lab-api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: chaos-lab-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chaos-lab-api
    spec:
      serviceAccountName: chaos-lab-api
      # redundante com o ServiceAccount de proposito: o PodSpec vence, e se
      # alguem corrigir um lado e esquecer o outro, ainda fica negado
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          # imagem propria: a release nao tem tsx (devDependency) nem scripts/.
          # Embutir o compilador na imagem de producao anularia o multi-stage.
          image: chaos-lab-migrator:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["./node_modules/.bin/tsx", "scripts/migrate.ts"]
          envFrom:
            - configMapRef: { name: chaos-lab-config }
          env:
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef: { name: chaos-lab-secrets, key: postgres-url }
            - name: MONGO_URL
              valueFrom:
                secretKeyRef: { name: chaos-lab-secrets, key: mongodb-url }
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: chaos-lab-secrets, key: jwt-secret }
            - name: WEBHOOK_HMAC_SECRET
              valueFrom:
                secretKeyRef: { name: chaos-lab-secrets, key: hmac-secret }
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      containers:
        - name: api
          image: chaos-lab-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 3000, name: http, protocol: TCP }
          envFrom:
            - configMapRef: { name: chaos-lab-config }
          env:
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef: { name: chaos-lab-secrets, key: postgres-url }
            - name: MONGO_URL
              valueFrom:
                # era mongo-url: chave inexistente no Secret. O sintoma e
                # CreateContainerConfigError - o container nem chega a iniciar,
                # entao kubectl logs nao mostra nada.
                secretKeyRef: { name: chaos-lab-secrets, key: mongodb-url }
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: chaos-lab-secrets, key: jwt-secret }
            - name: WEBHOOK_HMAC_SECRET
              valueFrom:
                secretKeyRef: { name: chaos-lab-secrets, key: hmac-secret }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          startupProbe:
            httpGet: { path: /health/live, port: http }
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        # raiz somente-leitura exige um lugar para escrever temporario
        - name: tmp
          emptyDir: {}
