apiVersion: v1
kind: ConfigMap
metadata:
  name: chaos-lab-config
  namespace: chaos-lab
data:
  NODE_ENV: "production"
  SERVICE_NAME: "chaos-lab-api"
  SERVICE_VERSION: "1.0.0"
  HOST: "0.0.0.0"
  PORT: "3000"
  LOG_LEVEL: "info"
  METRICS_PATH: "/metrics"
  OTL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo.observability:4318"