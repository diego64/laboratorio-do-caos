apiVersion: v1
kind: Service
metadata:
  name: mongo-headless
  namespace: chaos-lab
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: mongo
  ports:
    - { name: mongo, port: 27017, targetPort: 27017 }
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: chaos-lab
spec:
  selector:
    app.kubernetes.io/name: mongo
  ports:
    - { name: mongo, port: 27017, targetPort: 27017 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: chaos-lab
spec:
  serviceName: mongo-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mongo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - { containerPort: 27017 }
          env:
            - { name: MONGO_INITDB_ROOT_USERNAME, value: chaos }
            - { name: MONGO_INITDB_ROOT_PASSWORD, value: chaos }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "1",    memory: "1Gi" }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /data/db }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources:
          requests:
            storage: 5Gi
