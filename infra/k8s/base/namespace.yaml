apiVersion: v1
kind: Namespace
metadata:
  name: chaos-lab
  labels:
    pod-security.kubernetes.io/enforce: restricted
    # versao fixa de proposito: o PSA versiona os perfis, e "latest" faz o
    # criterio endurecer sozinho no dia do upgrade do cluster, sem que nenhum
    # arquivo daqui mude.
    pod-security.kubernetes.io/enforce-version: v1.33
