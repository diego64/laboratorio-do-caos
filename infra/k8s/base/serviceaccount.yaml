# automountServiceAccountToken e campo de nivel raiz do ServiceAccount, nao de
# metadata. Dentro de metadata ele e desconhecido: falha na validacao estrita e
# desaparece sem ela - montando o token justamente onde se declarou o contrario.
# O namespace vem do kustomization.yaml; declarar aqui so cria divergencia.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chaos-lab-api
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mongo
automountServiceAccountToken: false
