# Segredo de laboratorio, em texto plano de proposito. Para qualquer ambiente
# real o caminho e Sealed Secrets, External Secrets Operator ou SOPS - o
# manifesto guarda a referencia ou o valor cifrado, nunca o segredo.
#
# As URLs usam o nome do Service. Dentro de um pod, localhost e o proprio pod:
# nao e o no e nao e o cluster. O CoreDNS resolve postgres e mongo no namespace.
apiVersion: v1
kind: Secret
metadata:
  name: chaos-lab-secrets
type: Opaque
stringData:
  postgres-url: "postgresql://chaos:chaos@postgres:5432/laboratoriodocaos"
  mongodb-url: "mongodb://chaos:chaos@mongo:27017/chaoslab?authSource=chaoslab"
  jwt-secret: "98226489150527ef0753d0b3cb8763cd8100c1d4dde04858ef5827de79482576"
  hmac-secret: "hmac-local-chaos-lab"

  # consumidas pelos bancos, nao pela aplicacao
  postgres-user: "chaos"
  postgres-password: "chaos"
  postgres-db: "laboratoriodocaos"
  mongo-root-username: "root"
  mongo-root-password: "root"
  mongo-app-username: "chaos"
  mongo-app-password: "chaos"
  mongo-database: "chaoslab"
