apiVersion: v1
kind: Service
metadata:
  name: chaos-lab-service
  namespace: chaos-lab
  labels:
    app.kubernetes.io/name: chaos-lab-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: chaos-lab-api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP