groups:
  - name: chaos-lab-api
    rules:
      - alert: TaxaDeErro5xxAlta
        expr: rate(http_requests_total{status_code=~"5.."}) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Taxa de 5xx acima de 5%"

      - alert: LatenciaP95Alta
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_ms_bucket[5m])) by (le)) > 500
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p95 acima de 500ms"

      - alert: DependenciaIndisponivel
        expr: dependency_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Dependencia {{ $labels.dependency }} indisponivel"
