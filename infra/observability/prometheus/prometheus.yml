global:
  scrape_interval: 60s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: chaos-lab-api
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:3000"]
        labels:
          service: chaos-lab-api

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
